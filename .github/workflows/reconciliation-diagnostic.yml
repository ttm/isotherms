name: Reproduce scaling and smoothing diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'data/oliveira_1992_fig1_approximate_trace.csv'
      - 'results/explicit_water_pilot/summary.csv'
      - 'scripts/reconciliation_diagnostic.py'
      - 'tests/test_reconciliation_diagnostic.py'
      - '.github/workflows/reconciliation-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e '.[plot,test]'
          python -m pytest -q tests/test_reconciliation_diagnostic.py
      - name: Generate descriptive figures and calibration diagnostics
        run: |
          python scripts/reconciliation_diagnostic.py
      - name: Commit reproducible diagnostics (not validated predictions)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f figures/reconciliation_diagnostic.png results/reconciliation_diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'diagnostics: regenerate descriptive scaling/area-smoothing comparison'
          git push origin HEAD:main