name: Molecular isotherm tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[plot,test]'
      - name: Unit tests
        run: pytest -q
      - name: Generate reference diagnostics
        run: python scripts/run_model.py --points 21 --out results
