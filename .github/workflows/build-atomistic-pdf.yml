name: Build atomistic manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'article/atomistic_surface_potential.md'
      - 'article/historical_benchmark.md'
      - 'article/reconciliation_diagnostic.md'
      - 'scripts/reconciliation_diagnostic.py'
      - 'tests/test_reconciliation_diagnostic.py'
      - 'results/explicit_water_pilot/summary.csv'
      - 'data/oliveira_1992_fig1_approximate_trace.csv'
      - 'scripts/compare_historical_isotherm.py'
      - 'scripts/build_atomistic_pdf.sh'
      - '.github/workflows/build-atomistic-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-article:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare historical and exploratory reconciliation figures
        run: |
          python -m pip install -e '.[plot,test]'
          python scripts/compare_historical_isotherm.py
          python scripts/reconciliation_diagnostic.py
          pytest -q tests/test_historical_comparison.py tests/test_reconciliation_diagnostic.py
          test -s figures/experimental_vs_md_pilot.png
          test -s figures/reconciliation_diagnostic.png
      - name: Build with Pandoc and LaTeX
        run: |
          docker run --rm --entrypoint sh \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}:/data" -w /data \
            pandoc/latex:3 -c '
              cd article
              pandoc atomistic_surface_potential.md \
                -o atomistic_surface_potential.pdf \
                --pdf-engine=pdflatex \
                -V documentclass=article \
                -V geometry:margin=0.8in \
                -V fontsize=10pt \
                -V linestretch=1.13 \
                -V colorlinks=true \
                --resource-path=.
            '
      - name: Validate PDF
        run: |
          file article/atomistic_surface_potential.pdf
          test "$(stat -c %s article/atomistic_surface_potential.pdf)" -gt 20000
          python - <<'PY'
          from pathlib import Path
          p=Path('article/atomistic_surface_potential.pdf')
          assert p.read_bytes().startswith(b'%PDF-')
          PY
      - name: Upload manuscript for layout inspection
        uses: actions/upload-artifact@v4
        with:
          name: atomistic-paper-pdf
          path: article/atomistic_surface_potential.pdf
          retention-days: 30
          if-no-files-found: error
      - name: Commit generated PDF to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f article/atomistic_surface_potential.pdf figures/experimental_vs_md_pilot.png figures/reconciliation_diagnostic.png results/historical_comparison_diagnostics.json results/reconciliation_diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: regenerate atomistic paper PDF from revised Markdown'
          git push origin HEAD:main