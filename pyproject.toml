[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-isotherms"
version = "0.1.0"
description = "Molecular-statistical model of fatty-acid Langmuir-film surface-potential isotherms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
